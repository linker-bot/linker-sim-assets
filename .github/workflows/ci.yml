name: CI
# Every push: build the data package once, then run tests/test_assets.py with it installed, on
# both MuJoCo versions the products use (linker-lab 3.17.0, linker-sim 4.0.1). The products
# install the same package from this repository at a tag (a git dependency), so a tag v<version>
# must match the package version.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: The tag matches the package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' pyproject.toml)
          test "v$version" = "$GITHUB_REF_NAME" || { echo "::error::tag $GITHUB_REF_NAME, pyproject $version"; exit 1; }
      - run: uv build --out-dir dist
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  test:
    needs: package
    strategy:
      fail-fast: false
      matrix:
        mujoco: ["3.17.0", "4.0.1"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - run: uv venv --python 3.12
      - run: uv pip install --group test "mujoco==${{ matrix.mujoco }}" dist/*.whl
      - run: .venv/bin/python -m pytest -q -rs
