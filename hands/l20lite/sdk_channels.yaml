# LinkerHand L20 Lite: the hand SDK's joint vector, mapped to this hand's URDF/MJCF joints.
#
# convention linear-fit-v0: an SDK value of 100 is the joint's lower limit and 0 its
# upper limit, linear in between. Limits are the joint limits in l20lite_left/right.urdf.
# "{S}" in a joint name is `l` for the left hand and `r` for the right hand.
schema_version: 1
convention: linear-fit-v0

# SDK channel index -> actuated joint, in the SDK's 10-DoF "L10" layout, which L20 Lite
# uses. The SDK groups channels by DoF type (thumb base, thumb side-swing, the four
# finger bases, three finger side-swings -- L20 Lite has no middle side-swing -- then
# thumb rotation), not per finger, so the order differs from the URDF's joint order.
# Ref: linkerhand-ros2-sdk Topic-Reference.md (L10灵巧手关节顺序); the thumb axes were
# confirmed on hardware.
channels:
  - "{S}h_thumb_cmc_pitch"   # 0  拇指根部   thumb base
  - "{S}h_thumb_cmc_yaw"     # 1  拇指侧摆   thumb side-swing
  - "{S}h_index_mcp_pitch"   # 2  食指根部   index base
  - "{S}h_middle_mcp_pitch"  # 3  中指根部   middle base
  - "{S}h_ring_mcp_pitch"    # 4  无名指根部  ring base
  - "{S}h_pinky_mcp_pitch"   # 5  小指根部   pinky base
  - "{S}h_index_mcp_roll"    # 6  食指侧摆   index side-swing
  - "{S}h_ring_mcp_roll"     # 7  无名指侧摆  ring side-swing
  - "{S}h_pinky_mcp_roll"    # 8  小指侧摆   pinky side-swing
  - "{S}h_thumb_cmc_roll"    # 9  拇指旋转   thumb rotation

# Per-joint [lower, upper] range to use instead of the URDF limit. Empty: the URDF
# limits are the range the SDK uses.
clip_overrides: {}
