# LinkerHand L25: the hand SDK's joint vector, mapped to this hand's URDF/MJCF joints.
# The same hardware is called G20 in the SDK and L20 in data collection.
#
# convention linear-fit-v0: an SDK value of 100 is the joint's lower limit and 0 its
# upper limit, linear in between. Limits are the joint limits in l25_left/right.urdf.
# "{S}" in a joint name is `l` for the left hand and `r` for the right hand.
schema_version: 2
convention: linear-fit-v0
sdk_layout: l20-v1

# The full 20-slot vector the SDK sends, in order. Slots 11-14 are reserved (预留) and
# drive no joint; dropping them leaves the 16 active channels. Recordings that store the
# SDK packet as sent are 20 columns wide per hand.
#
# The SDK groups slots by DoF type (the five bases, the five side-swings, thumb yaw,
# reserved, then the five tips), not per finger, so the order differs from the URDF's
# joint order.
# Ref: linkerhand-ros2-sdk Topic-Reference.md (L20灵巧手关节顺序); the thumb axes were
# confirmed on hardware.
slots:
  - "{S}h_thumb_cmc_pitch"   # 0   拇指根部   thumb base
  - "{S}h_index_mcp_pitch"   # 1   食指根部   index base
  - "{S}h_middle_mcp_pitch"  # 2   中指根部   middle base
  - "{S}h_ring_mcp_pitch"    # 3   无名指根部  ring base
  - "{S}h_pinky_mcp_pitch"   # 4   小指根部   pinky base
  - "{S}h_thumb_cmc_roll"    # 5   拇指侧摆   thumb side-swing
  - "{S}h_index_mcp_roll"    # 6   食指侧摆   index side-swing
  - "{S}h_middle_mcp_roll"   # 7   中指侧摆   middle side-swing
  - "{S}h_ring_mcp_roll"     # 8   无名指侧摆  ring side-swing
  - "{S}h_pinky_mcp_roll"    # 9   小指侧摆   pinky side-swing
  - "{S}h_thumb_cmc_yaw"     # 10  拇指横摆   thumb yaw
  - reserved                 # 11  预留
  - reserved                 # 12  预留
  - reserved                 # 13  预留
  - reserved                 # 14  预留
  - "{S}h_thumb_mcp"         # 15  拇指尖部   thumb tip
  - "{S}h_index_pip"         # 16  食指末端   index tip
  - "{S}h_middle_pip"        # 17  中指末端   middle tip
  - "{S}h_ring_pip"          # 18  无名指末端  ring tip
  - "{S}h_pinky_pip"         # 19  小指末端   pinky tip

# Per-joint [lower, upper] range to use instead of the URDF limit. Empty: the URDF
# limits are the range the SDK uses.
clip_overrides: {}
