  rpy: [0, 0, -1.5707963267948966]
- child: hand:wrist_mount
  parent: flange:hand_mount
  xyz: [0, 0, 0]
  rpy: [0, 0, 3.141592653589793]
collision_exclusions:
- body1: arm:AR5_5_08L_W4C4A6_link7
  body2: flange:flange_link
