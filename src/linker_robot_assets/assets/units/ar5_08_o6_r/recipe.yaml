schema_version: 1
name: ar5_08_o6_r
description: >
  Single AR5_08 right arm + Linkerhand O6 right, welded into one articulation
  (arm frozen to world; hand welded to the arm flange/tool0). Wrist transform
  follows the ar5_08_l6 convention (hand base rotated -90deg about tool0 Z)
  plus a +20 mm tool0-Z (fingertip) offset for flange thickness. Finger
  equality/mimic coupling carried through the composed MJCF.

components:
  arm:
    component: arms/ar5_08
    variant: right
  hand:
    component: hands/linkerhand_o6
    variant: right

freeze_base: arm

mounts:
  - child: hand:wrist_mount
    parent: arm:tool0
    xyz: [0.0, 0.0, 0.0205]
    rpy: [0.0, 0.0, -1.5708]

collision_exclusions:
- body1: arm:AR5_5_08R_W4C4A6_link7
  body2: hand:rh_hand_base_link
  reason: Installation seam at arm:tool0 -> hand:wrist_mount; other links remain collidable.
