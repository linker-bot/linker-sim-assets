schema_version: 1
name: ar5_08_o6_bench_bimanual
description: Bimanual AR5_08 and O6 with shared flanges and removable top ZED module.
  Each arm/hand remains addressable by its existing role.
components:
  base:
    component: bases/bench_table
    variant: default
  arm_left:
    component: arms/ar5_08
    variant: left
  arm_right:
    component: arms/ar5_08
    variant: right
  hand_left:
    component: hands/linkerhand_o6
    variant: left
  hand_right:
    component: hands/linkerhand_o6
    variant: right
  top_camera:
    component: sensors/workstation_zed2i
    variant: default
  flange_left:
    component: attachments/ar5_08_l6_o6_flange
    variant: default
  flange_right:
    component: attachments/ar5_08_l6_o6_flange
    variant: default
freeze_base: base
mounts:
- child: arm_left:base_mount
  parent: base:arm_left_mount
  xyz: [0.0, 0.0, 0.0]
  rpy: [0.0, 0.0, 0.0]
- child: arm_right:base_mount
  parent: base:arm_right_mount
  xyz: [0.0, 0.0, 0.0]
  rpy: [0.0, 0.0, 0.0]
- child: top_camera:base_mount
  parent: base:camera_mount
  xyz: [0, 0, 0]
  rpy: [0, 0, 0]
- child: flange_left:arm_mount
  parent: arm_left:tool0
  xyz: [0, 0, 0]
  rpy: [0, 0, -1.5707963267948966]
- child: hand_left:wrist_mount
  parent: flange_left:hand_mount
  xyz: [0, 0, 0]
  rpy: [0, 0, 3.141592653589793]
- child: flange_right:arm_mount
  parent: arm_right:tool0
  xyz: [0, 0, 0]
  rpy: [0, 0, 1.5707963267948966]
- child: hand_right:wrist_mount
  parent: flange_right:hand_mount
  xyz: [0, 0, -0.002]
  rpy: [0, 0, -3.141592653589793]
collision_exclusions:
- body1: base:workstation_link
  body2: arm_left:AR5_5_08L_W4C4A6_base
  reason: Installation seam at base:arm_left_mount -> arm_left:base_mount; other links
    remain collidable.
- body1: base:workstation_link
  body2: arm_right:AR5_5_08R_W4C4A6_base
  reason: Installation seam at base:arm_right_mount -> arm_right:base_mount; other
    links remain collidable.
- body1: base:workstation_link
  body2: top_camera:camera_base_link
  reason: Top stand is bolted to the bench crossbar; camera housing remains collidable.
- body1: arm_left:AR5_5_08L_W4C4A6_link7
  body2: flange_left:flange_link
  reason: Bolted large disk and 2 mm locating boss at the arm tool0 recess.
- body1: flange_left:flange_link
  body2: hand_left:lh_hand_base_link
  reason: Small adapter seating face and hand locating boss; other hand links remain
    collidable.
- body1: arm_right:AR5_5_08R_W4C4A6_link7
  body2: flange_right:flange_link
  reason: Bolted large disk and 2 mm locating boss at the arm tool0 recess.
- body1: flange_right:flange_link
  body2: hand_right:rh_hand_base_link
  reason: Small adapter seating face and hand locating boss; other hand links remain
    collidable.
