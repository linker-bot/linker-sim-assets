schema_version: 1
name: ar5_08_l6_l
description: >
  Single AR5_08 left arm + Linkerhand L6 left, welded into one articulation
  (arm frozen to world; hand welded to the arm flange/tool0). Authored for
  linker-sim-isaac's combined arm+hand profile (== AR5V2_L6V1_L). The
  wrist transform reproduces Isaac's combined MJCF: hand base at the flange
  (tcp, z=0.09 from link7), rotated +90deg about Z. Finger equality/mimic
  coupling is carried through the composed MJCF.

components:
  arm:
    component: arms/ar5_08
    variant: left
  hand:
    component: hands/linkerhand_l6
    variant: left

freeze_base: arm

mounts:
  # Matches assets/combined_system/AR5V2_L6V1_L/AR5V2_L6V1_L.xml:
  # L6V1_L_hand_base_link at flan_link, pos 0 0 0, quat (w,x,y,z)=
  # (0.7071,0,0,0.7071) == rpy [0,0,+1.5708].
  - child: hand:wrist_mount
    parent: arm:tool0
    xyz: [0.0, 0.0, 0.0]
    rpy: [0.0, 0.0, 1.5708]
