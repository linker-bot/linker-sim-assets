# Builds the data package `linker-lw-v0` (import name `linker_lw_v0`): LW-v0's files, no code.
# Products install it from this repository at a tag `v<version>`:
#   "linker-lw-v0 @ git+https://github.com/linker-bot/linker-sim-assets@v<version>"
# (uv.lock pins the commit). It is not published to PyPI.
[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "linker-lw-v0"
version = "1.0.0"
description = "LW-v0, Linkerbot's two-arm camera workstation, as MJCF and URDF with meshes (data only)"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.10"
dependencies = []

[project.urls]
Repository = "https://github.com/linker-bot/linker-sim-assets"

# The files lw_v0.xml and lw_v0.urdf load (the scene, its written units and the components'
# meshes), the O6 hand's SDK channel map and motor constants, and the AR5_08's controller limits,
# at their repository paths under linker_lw_v0/. Find them with importlib.resources.files("linker_lw_v0").
[tool.hatch.build.targets.wheel]
bypass-selection = true

[tool.hatch.build.targets.wheel.force-include]
"assemblies/lw_v0/lw_v0.xml" = "linker_lw_v0/assemblies/lw_v0/lw_v0.xml"
"assemblies/lw_v0/left.xml" = "linker_lw_v0/assemblies/lw_v0/left.xml"
"assemblies/lw_v0/right.xml" = "linker_lw_v0/assemblies/lw_v0/right.xml"
"assemblies/lw_v0/top_camera.xml" = "linker_lw_v0/assemblies/lw_v0/top_camera.xml"
"assemblies/lw_v0/lw_v0.urdf" = "linker_lw_v0/assemblies/lw_v0/lw_v0.urdf"
"supports/lw_v0/support.xml" = "linker_lw_v0/supports/lw_v0/support.xml"
"supports/lw_v0/meshes" = "linker_lw_v0/supports/lw_v0/meshes"
"arms/ar5_08/meshes" = "linker_lw_v0/arms/ar5_08/meshes"
"arms/ar5_08/controller.yaml" = "linker_lw_v0/arms/ar5_08/controller.yaml"
"flanges/ar5_08_o6/meshes" = "linker_lw_v0/flanges/ar5_08_o6/meshes"
"brackets/gemini335l_wrist/meshes" = "linker_lw_v0/brackets/gemini335l_wrist/meshes"
"brackets/zed2i_column/meshes" = "linker_lw_v0/brackets/zed2i_column/meshes"
"cameras/gemini335l/meshes" = "linker_lw_v0/cameras/gemini335l/meshes"
"cameras/zed2i/meshes" = "linker_lw_v0/cameras/zed2i/meshes"
"hands/o6/meshes" = "linker_lw_v0/hands/o6/meshes"
"hands/o6/sdk_channels.yaml" = "linker_lw_v0/hands/o6/sdk_channels.yaml"
"hands/o6/motor.yaml" = "linker_lw_v0/hands/o6/motor.yaml"

[tool.hatch.build.targets.sdist]
include = ["assemblies/lw_v0/lw_v0.xml", "assemblies/lw_v0/left.xml", "assemblies/lw_v0/right.xml",
           "assemblies/lw_v0/top_camera.xml", "assemblies/lw_v0/lw_v0.urdf", "supports/lw_v0/support.xml",
           "supports/lw_v0/meshes", "arms/ar5_08/meshes", "arms/ar5_08/controller.yaml", "flanges/ar5_08_o6/meshes",
           "brackets/gemini335l_wrist/meshes", "brackets/zed2i_column/meshes", "cameras/gemini335l/meshes",
           "cameras/zed2i/meshes", "hands/o6/meshes", "hands/o6/sdk_channels.yaml", "hands/o6/motor.yaml",
           "LICENSE", "NOTICE", "README.md"]

# The test environment: `uv run --group test pytest`. CI runs it on both MuJoCo versions the
# products use (linker-lab 3.17.0, linker-sim 4.0.1).
[dependency-groups]
test = ["pytest>=8", "numpy>=1.24", "pyyaml>=6", "mujoco>=3.17"]
